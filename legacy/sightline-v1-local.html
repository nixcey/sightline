<title>Sightline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F2EFEA;
  --bg-grain:#ECE8E1;
  --surface:#FBFAF7;
  --surface-2:#F4F1EB;
  --rail-bg:#171A1F;
  --rail-ink:#E9E7E2;
  --rail-dim:#8A8F98;
  --rail-line:#2A2E35;
  --ink:#1B1E22;
  --ink-2:#4C5158;
  --ink-3:#7B818A;
  --border:#D9D4CB;
  --border-2:#C8C2B6;
  --accent:#FF4655;
  --accent-ink:#FFFFFF;
  --accent-soft:#FCE1E3;
  --good:#12897B;
  --good-soft:#D2ECE7;
  --warn:#B26B00;
  --warn-soft:#F6E6CC;
  --crit:#C6353F;
  --crit-soft:#F6D8D9;
  --free-0:transparent;
  --free-1:rgba(18,137,123,.14);
  --free-2:rgba(18,137,123,.30);
  --free-3:rgba(18,137,123,.52);
  --shadow:0 1px 2px rgba(20,20,25,.06),0 8px 24px -12px rgba(20,20,25,.14);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:'Chakra Petch','IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101215;
    --bg-grain:#14171B;
    --surface:#191C21;
    --surface-2:#1F232A;
    --rail-bg:#0C0E11;
    --rail-ink:#E9E7E2;
    --rail-dim:#767C86;
    --rail-line:#20242B;
    --ink:#E7E5E0;
    --ink-2:#AEB3BB;
    --ink-3:#7C828C;
    --border:#2A2F37;
    --border-2:#363C45;
    --accent:#FF4655;
    --accent-ink:#160B0C;
    --accent-soft:#3A1C1F;
    --good:#3AD1BF;
    --good-soft:#123531;
    --warn:#E7A343;
    --warn-soft:#3A2C13;
    --crit:#F0656E;
    --crit-soft:#3A1D20;
    --free-1:rgba(58,209,191,.12);
    --free-2:rgba(58,209,191,.24);
    --free-3:rgba(58,209,191,.42);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#101215;--bg-grain:#14171B;--surface:#191C21;--surface-2:#1F232A;
  --rail-bg:#0C0E11;--rail-ink:#E9E7E2;--rail-dim:#767C86;--rail-line:#20242B;
  --ink:#E7E5E0;--ink-2:#AEB3BB;--ink-3:#7C828C;--border:#2A2F37;--border-2:#363C45;
  --accent:#FF4655;--accent-ink:#160B0C;--accent-soft:#3A1C1F;
  --good:#3AD1BF;--good-soft:#123531;--warn:#E7A343;--warn-soft:#3A2C13;--crit:#F0656E;--crit-soft:#3A1D20;
  --free-1:rgba(58,209,191,.12);--free-2:rgba(58,209,191,.24);--free-3:rgba(58,209,191,.42);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  background-image:radial-gradient(var(--bg-grain) 1px,transparent 1px);background-size:4px 4px}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.01em;text-wrap:balance}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:214px 1fr;min-height:100vh}
.rail{background:var(--rail-bg);color:var(--rail-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--rail-line)}
.brand{padding:18px 16px 14px;border-bottom:1px solid var(--rail-line)}
.brand .mark{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.16em;display:flex;align-items:center;gap:8px}
.brand .mark::before{content:"";width:10px;height:16px;background:var(--accent);
  clip-path:polygon(0 0,100% 0,100% 70%,60% 100%,0 100%)}
.brand .sub{font-size:10px;letter-spacing:.28em;color:var(--rail-dim);text-transform:uppercase;margin-top:4px;padding-left:18px}
.teamsel{padding:12px 12px 10px;border-bottom:1px solid var(--rail-line)}
.teamsel label{font-size:9px;letter-spacing:.22em;color:var(--rail-dim);text-transform:uppercase}
.teamsel select{width:100%;margin-top:5px;background:#000;color:var(--rail-ink);border:1px solid var(--rail-line);
  padding:7px 8px;font-family:var(--disp);font-size:13px;letter-spacing:.04em;border-radius:2px}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--rail-dim);
  padding:9px 10px;font-size:12.5px;letter-spacing:.04em;cursor:pointer;border-radius:2px;text-align:left;
  font-family:var(--disp);font-weight:500;text-transform:uppercase}
.nav button svg{width:17px;height:17px;flex:none}
.nav button:hover{color:var(--rail-ink);background:rgba(255,255,255,.04)}
.nav button.on{color:var(--rail-ink);background:rgba(255,70,85,.12);box-shadow:inset 2px 0 0 var(--accent)}
.railfoot{padding:10px 12px;border-top:1px solid var(--rail-line);display:flex;gap:6px;flex-wrap:wrap}
.railfoot button{flex:1 1 40%;background:none;border:1px solid var(--rail-line);color:var(--rail-dim);padding:6px;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;font-family:var(--disp)}
.railfoot button:hover{color:var(--rail-ink);border-color:var(--rail-dim)}

.stage{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.topbar .tt{display:flex;flex-direction:column;gap:2px}
.topbar h1{font-size:20px;letter-spacing:.03em}
.topbar .crumb{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
.weekpick{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.weekpick button{background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2);width:26px;height:26px;
  cursor:pointer;border-radius:2px;font-size:13px}
.weekpick button:hover{border-color:var(--accent);color:var(--accent)}
.weekpick .lbl{min-width:150px;text-align:center;letter-spacing:.02em}
.tourpill{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-size:11px;text-transform:uppercase;
  letter-spacing:.08em;border:1px solid var(--border);padding:5px 9px;border-radius:2px;cursor:pointer;background:var(--surface-2);color:var(--ink-2)}
.tourpill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

main{padding:24px;max-width:1200px;width:100%}

/* ============ primitives ============ */
.grid{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:3px;box-shadow:var(--shadow)}
.panel.pad{padding:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.panel-h h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.panel-h .hint{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.panel-b{padding:16px}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-family:var(--disp)}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  padding:8px 14px;font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;border-radius:2px}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:none;color:var(--ink-2);border-color:var(--border-2)}
.btn.ghost:hover{color:var(--accent);border-color:var(--accent);filter:none}
.btn.sm{padding:5px 9px;font-size:10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icar{background:none;border:1px solid var(--border);color:var(--ink-3);width:26px;height:26px;border-radius:2px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.icar:hover{border-color:var(--accent);color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--disp);font-size:10.5px;font-weight:500;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--surface-2);
  color:var(--ink-2);border:1px solid var(--border)}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow-x:auto}

.stat{display:flex;flex-direction:column;gap:3px}
.stat .k{font-family:var(--disp);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:.01em}
.stat .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.stat .d{font-family:var(--mono);font-size:11px}
.up{color:var(--good)}.down{color:var(--crit)}.flat{color:var(--ink-3)}

.bar{height:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:2px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar > i.good{background:var(--good)}

.p111{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.p22{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.p31{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.p111,.p22,.p31{grid-template-columns:1fr}}

.cut{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}

.pcard{border:1px solid var(--border);border-radius:3px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard .top{display:flex;align-items:center;gap:10px}
.pcard .ico{width:34px;height:34px;display:grid;place-items:center;font-size:18px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:2px;flex:none}
.pcard .hd{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.02em}
.pcard .rl{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;font-family:var(--disp)}
.pcard .agents{display:flex;gap:4px;flex-wrap:wrap}

.empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13px}
.callout{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--surface-2);padding:12px 14px;border-radius:2px;font-size:13px}
.callout.good{border-left-color:var(--good)}
.callout.warn{border-left-color:var(--warn)}

/* schedule grid */
.sgrid{display:grid;grid-template-columns:56px repeat(7,1fr);font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.sgrid .hcell{background:var(--surface-2);padding:6px 4px;text-align:center;font-family:var(--disp);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--border-2)}
.sgrid .tcell{padding:2px 5px;text-align:right;color:var(--ink-3);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.sgrid .cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:15px;position:relative}
.sgrid .cell.f1{background:var(--free-1)}
.sgrid .cell.f2{background:var(--free-2)}
.sgrid .cell.f3{background:var(--free-3)}
.sgrid .cell.win{box-shadow:inset 2px 0 0 var(--good),inset -2px 0 0 var(--good)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border-2);border-radius:4px;max-width:540px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal-h h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-family:var(--disp);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.fld input,.fld select,.fld textarea{background:var(--surface-2);border:1px solid var(--border-2);color:var(--ink);
  padding:8px 10px;font-family:var(--sans);font-size:13px;border-radius:2px;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld .hint{font-size:11px;color:var(--ink-3)}
.fld.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:5px;font-size:11px;text-transform:none;letter-spacing:0;
  border:1px solid var(--border-2);padding:5px 8px;border-radius:2px;cursor:pointer;font-family:var(--sans);color:var(--ink-2)}
.checks label.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.checks input{display:none}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}

#toast-root{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:3px;font-size:12px;font-family:var(--disp);
  letter-spacing:.04em;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

.sub{color:var(--ink-3);font-size:12px}
.mono{font-family:var(--mono)}
.spark{display:block}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.rowline:last-child{border-bottom:0}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column}
  .nav{flex-direction:row;overflow-x:auto;flex-wrap:nowrap}
  .nav button{flex:none;white-space:nowrap}
  main{padding:16px}
  .topbar{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="app">
  <nav class="rail">
    <div class="brand">
      <div class="mark">SIGHTLINE</div>
      <div class="sub">ops deck</div>
    </div>
    <div class="teamsel">
      <label for="teamSelect">Active roster</label>
      <select id="teamSelect"></select>
    </div>
    <div class="nav" id="nav"></div>
    <div class="railfoot">
      <button id="btnTheme">Theme</button>
      <button id="btnExport">Export</button>
      <button id="btnImport">Import</button>

  <div class="stage">

      <div class="tt">

        <button class="tourpill" id="tourPill">◆ Tournament week</button>

          <button id="wkPrev" aria-label="Previous week">‹</button>
          <span class="lbl" id="wkLabel">—</span>
          <button id="wkNext" aria-label="Next week">›</button>
        </div>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>

<script>
/* ============================================================ constants */
const AGENTS=["Astra","Breach","Brimstone","Chamber","Clove","Cypher","Deadlock","Fade","Gekko","Harbor","Iso","Jett","KAY/O","Killjoy","Neon","Omen","Phoenix","Raze","Reyna","Sage","Skye","Sova","Tejo","Viper","Vyse","Waylay","Yoru"];
const MAPS=["Abyss","Ascent","Bind","Breeze","Fracture","Haven","Icebox","Lotus","Pearl","Split","Sunset"];
const ROLES=["Duelist","Initiator","Controller","Sentinel","Flex","IGL"];
const STATUS=["Starter","Sub","Trial","Inactive"];
const VERDICTS=["Shortlist","Hold","Pass","Signed"];
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const RANK_TIERS=["Iron","Bronze","Silver","Gold","Platinum","Diamond","Ascendant","Immortal","Radiant"];
const KEY="sightline.db.v2";
const RATING_BASELINE=1.00; // R2.0: 1.00 ≈ an average player

/* ============================================================ helpers */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const iso=d=>d.toISOString().slice(0,10);
const parse=s=>{const d=new Date(s+"T00:00:00");return d;};
function mondayOf(d){const x=new Date(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function fmtRange(mon){const end=addDays(mon,6);const o={month:"short",day:"numeric"};
  return mon.toLocaleDateString(undefined,o)+" – "+end.toLocaleDateString(undefined,o)+" "+end.getFullYear();}
function monthKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function monthLabel(k){const[y,m]=k.split("-");return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});}
const t2m=t=>{const[h,m]=t.split(":").map(Number);return h*60+m;};
const m2t=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
/* rank as a continuous scale: 3 units per tier (one per division), + RR/100 within a division */
function rankUnits(r){
  if(!r)return 0;
  if(r.tier==="Radiant")return 24+(r.rr||0)/100;
  return RANK_TIERS.indexOf(r.tier)*3+((r.div||1)-1)+(r.rr||0)/100;
}
function unitsToRank(u){
  u=clamp(u,0,24.999);
  if(u>=24)return {tier:"Radiant",div:1,rr:Math.round((u-24)*100)};
  const idx=Math.floor(u);
  return {tier:RANK_TIERS[Math.floor(idx/3)],div:idx%3+1,rr:Math.round((u-idx)*100)};
}
function rankStr(r){return !r?"—":r.tier==="Radiant"?"Radiant":`${r.tier} ${r.div}`;}
function rankShort(r){return rankStr(r).replace("Immortal","Imm").replace("Ascendant","Asc").replace("Diamond","Dia").replace("Platinum","Plat").replace("Radiant","Rad");}
function fmtRank(r){return !r?"—":rankStr(r)+((r.tier==="Radiant"&&!r.rr)?"":` · ${r.rr||0} RR`);}
function avgRank(ranks){const v=(ranks||[]).filter(Boolean);return v.length?unitsToRank(mean(v.map(rankUnits))):null;}

/* estimators for when a scrim row is missing ADR / KAST (manual entry without a tracker) */
const estADR=kpr=>Math.round(clamp(40+kpr*145,45,260));
const estKAST=(kpr,dpr)=>Math.round(clamp(100*(0.55+kpr*0.32-dpr*0.24),35,95));
/* HLTV Rating 2.0 — community-derived coefficients (kast 0-100, adr per round),
   recentred for Valorant's higher ADR scale so a league-average game ≈ 1.00. */
function rating20(k,d,a,rounds,adr,kast){
  if(!rounds)return null;
  const kpr=k/rounds,dpr=d/rounds,apr=a/rounds;
  if(adr==null)adr=estADR(kpr);
  if(kast==null)kast=estKAST(kpr,dpr);
  const impact=2.13*kpr+0.42*apr-0.41;
  const raw=0.0073*kast+0.3591*kpr-0.5329*dpr+0.2372*impact+0.0032*adr+0.1587;
  return raw-0.27;
}

/* "Immortal 1" / "Radiant" / "Unrated" (+ RR) -> {tier,div,rr} | null */
function parseRankName(s,rr){
  if(!s||/unrated|unranked/i.test(s))return null;
  if(/radiant/i.test(s))return {tier:"Radiant",div:1,rr:rr||0};
  const m=String(s).match(/([A-Za-z]+)\s*([123])/);
  if(!m)return null;
  const tier=RANK_TIERS.find(t=>t.toLowerCase()===m[1].toLowerCase());
  return tier?{tier,div:+m[2],rr:rr||0}:null;
}

/* ---- rank provider ----------------------------------------------------------
   Pulls a player's live competitive rank from their Riot ID.
   tracker.gg's own API and Riot's official API can't be called from a static
   page (no CORS, bot protection, no public "current rank by Riot ID" endpoint).
   This uses the community HenrikDev Valorant API, which is CORS-enabled and
   takes a free key (register in their Discord). When a backend is added, move
   this fetch server-side and keep the key there. */
const RankProvider={
  regionFor:server=>({EU:"eu",NA:"na",APAC:"ap",BR:"br",LATAM:"latam",KR:"kr"}[server]||"eu"),
  async fetchRank({name,tag},region,key){
    const url=`https://api.henrikdev.xyz/valorant/v3/mmr/${region}/pc/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`;
    let res;
    try{res=await fetch(url,{headers:key?{Authorization:key}:{}});}
    catch(e){throw new Error("network/CORS blocked — serve over http, not file://");}
    if(res.status===404)throw new Error("Riot ID not found");
    if(res.status===401||res.status===403)throw new Error("API key missing or invalid");
    if(res.status===429)throw new Error("rate limited — wait a minute");
    if(!res.ok)throw new Error("HTTP "+res.status);
    const j=await res.json().catch(()=>null);
    const cur=(j&&j.data&&(j.data.current||j.data.current_data))||{};
    const tierName=(cur.tier&&cur.tier.name)||cur.currenttierpatched;
    const rr=(cur.rr!=null?cur.rr:cur.ranking_in_tier)||0;
    return parseRankName(tierName,rr);
  }
};

  const targets=(only?[only]:t.roster).filter(p=>p.riotId&&p.riotId.name&&p.riotId.tag);

    }catch(e){fail++;_syncErr=e.message;}

function scrimRatings(scrim){
  const rounds=(scrim.rw||0)+(scrim.rl||0);
  return scrim.lineup.map(l=>{
    const kpr=rounds?l.k/rounds:0,dpr=rounds?l.d/rounds:0;

    return {...l,adr,kast,kd:l.k/Math.max(l.d,1),
      rating:rating20(l.k,l.d,l.a,rounds,adr,kast)};

function playerRolling(pid,n){
  const list=team().scrims.slice().sort((a,b)=>a.date<b.date?1:-1);
  const vals=[];
  for(const s of list){const row=scrimRatings(s).find(r=>r.pid===pid&&r.present);
    if(row&&row.rating!=null){vals.push({date:s.date,rating:row.rating,kd:row.kd,map:s.map});}
    if(vals.length>=n)break;}
  return vals;
}
function performanceTable(n){
  return team().roster.filter(p=>p.status==="Starter"||p.status==="Sub").map(p=>{
    const cur=playerRolling(p.id,n);

    const a=mean(cur.map(v=>v.rating));
    const pv=mean(prev.map(v=>v.rating));
    const kd=mean(cur.map(v=>v.kd));
    return {p,games:cur.length,rating:a,prevRating:pv,delta:(a!=null&&pv!=null)?a-pv:null,kd,
      flag:a!=null&&a<RATING_BASELINE,trend:cur.map(v=>v.rating).reverse()};

}

function bestAgentsForMap(map){
  const rows=team().scrims.filter(s=>s.map===map).flatMap(s=>{

    return rt.filter(r=>r.present).map(r=>({pid:r.pid,agent:r.agent,win,rating:r.rating??RATING_BASELINE}));

  const byPlayer={};
  rows.forEach(r=>{

    return {p,opts,best:opts[0]||null};

/* ============================================================ free-time solver */
function freeSolve(){
  const s=team().schedule;
  const ws=t2m(s.winStart),we=t2m(s.winEnd);
  const active=team().roster.filter(p=>p.status==="Starter"||(s.includeSubs&&p.status==="Sub"));
  const step=30;
  const grid=[];// [day][slotIdx] = freeCount
  const windows=[];
  for(let day=0;day<7;day++){
    grid[day]=[];
    let runStart=null;
    for(let m=ws;m<we;m+=step){
      let free=0;
      active.forEach(p=>{
        const busy=s.blocks.some(b=>b.pid===p.id&&b.day===day&&t2m(b.start)<m+step&&t2m(b.end)>m);
        if(!busy)free++;
      });
      grid[day].push(free);
      const allFree=free===active.length&&active.length>0;
      if(allFree&&runStart==null)runStart=m;
      if((!allFree||m+step>=we)&&runStart!=null){
        const end=allFree?m+step:m;
        if(end-runStart>=90)windows.push({day,start:runStart,end,mins:end-runStart});
        runStart=null;
      }
    }
  }
  return {grid,windows,active,ws,we,step};
}

function statCard(k,v,extra,sub){return `<div class="panel pad cut"><div class="stat">
  <span class="k">${k}</span><span class="v">${v}</span>
  ${extra||""}
  ${sub?`<span class="d flat">${sub}</span>`:""}</div></div>`;}
function bar(f,good){return `<div class="bar"><i class="${good?'good':''}" style="width:${clamp(f*100,0,100)}%"></i></div>`;}
function monthBody(k){

  return `<div class="eyebrow">Theme</div><p style="margin:0 0 12px">${esc(m.theme)}</p>

    <div style="margin-top:12px"><button class="btn ghost sm" onclick="editMonth('${k}')">Edit month</button></div>`;

window.toggleMonthGoal=(k,i)=>{team().activities.months[k].goals[i].done=!team().activities.months[k].goals[i].done;save();};
window.editMonth=(k)=>{
  const m=team().activities.months[k]||{theme:"",goals:[]};
  openForm({title:"Month focus · "+monthLabel(k),fields:[
    {name:"theme",label:"Theme",type:"textarea",value:m.theme},
    {name:"goals",label:"Goals (one per line)",type:"textarea",value:m.goals.map(g=>g.text).join("\n"),hint:"Checkboxes reset when you rename a goal"},
  ]},d=>{

function rankChart(series){
  const w=580,h=210,pad=34;
  const pts=series.map(s=>rankUnits(s.rank));
  const lo=Math.floor(Math.min(...pts)-0.6),hi=Math.ceil(Math.max(...pts)+0.6);
  const x=i=>pad+i*(w-2*pad)/(series.length-1);
  const y=v=>h-pad-(v-lo)/(hi-lo)*(h-2*pad);
  const line=pts.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const gl=[];for(let u=Math.ceil(lo);u<=hi;u++){if(u%1===0)gl.push(u);}
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible">
    <defs><linearGradient id="rg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".26"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${gl.map(u=>`<line x1="${pad}" x2="${w-pad}" y1="${y(u)}" y2="${y(u)}" stroke="var(--border)" stroke-width="1"/>
      <text x="6" y="${y(u)+3}" font-size="8.5" fill="var(--ink-3)" font-family="'Chakra Petch',sans-serif">${rankShort(unitsToRank(u))}</text>`).join("")}
    <polygon points="${x(0)},${h-pad} ${line} ${x(series.length-1)},${h-pad}" fill="url(#rg)"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===pts.length-1?4:2.6}" fill="var(--accent)" ${series[i].live?'stroke="var(--surface)" stroke-width="2"':''}/>
      <text x="${x(i)}" y="${h-10}" font-size="8.5" fill="var(--ink-3)" text-anchor="middle" font-family="'IBM Plex Mono',monospace">${series[i].live?'now':series[i].date.slice(5)}</text>`).join("")}
  </svg>`;
}

function miniSpark(vals){
  if(!vals||vals.length<2)return '<span class="sub">—</span>';
  const w=70,h=20,min=Math.min(...vals,0.8),max=Math.max(...vals,1.2);
  const x=i=>i*w/(vals.length-1),y=v=>h-(v-min)/(max-min)*h;
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <line x1="0" x2="${w}" y1="${y(1)}" y2="${y(1)}" stroke="var(--border-2)" stroke-dasharray="2 2"/>
    <polyline points="${vals.map((v,i)=>x(i)+','+y(v)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
    <circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="2.4" fill="var(--accent)"/>
  </svg>`;
}

          <div class="top"><div class="ico">${['①','②','③'][i]}</div>
          <div style="flex:1"><div class="hd">${esc(t.handle)}</div><div class="rl">${esc(t.role)} · ${t.tier} ${t.div}</div></div></div>
          <div class="stat"><span class="k">Composite</span><span class="v">${t.composite.toFixed(1)}<small>/10</small></span></div>
          <div>${chipScore("Mech",t.scores.mech)}${chipScore("Util",t.scores.util)}${chipScore("Comms",t.scores.comms)}${chipScore("Att",t.scores.att)}</div>
          <span class="chip ${t.verdict==='Shortlist'?'good':t.verdict==='Signed'?'accent':'warn'}">${t.verdict}</span>
        </div>`).join("")||'<div class="sub">No tryouts logged</div>'}
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><h3>Tryout archive</h3><span class="hint">${team().tryouts.length} logged</span></div>
      <div class="grid">
        ${scored.map(t=>`<div class="panel-b" style="border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
            <div>
              <div style="font-family:var(--disp);font-weight:700;font-size:15px">${esc(t.handle)}
                <span class="sub" style="font-weight:400">· ${esc(t.role)} · ${t.tier} ${t.div} · ${t.date}</span></div>
              <div class="agents" style="margin:6px 0">${t.agents.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>
              <div>${chipScore("Mech",t.scores.mech)}${chipScore("Util",t.scores.util)}${chipScore("Comms",t.scores.comms)}${chipScore("Att",t.scores.att)}
              <span class="chip accent">Σ ${t.composite.toFixed(1)}</span></div>
              <p class="sub" style="margin:8px 0 0;max-width:60ch">${esc(t.notes)}</p>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
              <span class="chip ${t.verdict==='Shortlist'?'good':t.verdict==='Pass'?'crit':t.verdict==='Signed'?'accent':'warn'}">${t.verdict}</span>
              <button class="icar" data-edittry="${t.id}">✎</button>
            </div>
          </div>
        </div>`).join("")||'<div class="empty">No tryouts yet</div>'}
      </div>
    </div>
  </div>`;
  $("#addTry").onclick=()=>editTryout();
  M.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{state.tryoutSort=b.dataset.sort;render();});
  M.querySelectorAll("[data-edittry]").forEach(b=>b.onclick=()=>editTryout(b.dataset.edittry));
};
function chipScore(k,v){const c=v>=8?'good':v>=6?'':'crit';return `<span class="chip ${c}">${k} ${v}</span>`;}
function editTryout(id){
  const t=id?team().tryouts.find(x=>x.id===id):{handle:"",role:"Duelist",tier:"Immortal",div:1,agents:[],date:iso(new Date()),
    scores:{mech:5,util:5,comms:5,att:5},verdict:"Hold",notes:""};
  openForm({title:id?"Edit tryout · "+t.handle:"Log tryout",del:id?()=>{team().tryouts=team().tryouts.filter(x=>x.id!==id);save();render();toast("Tryout removed");}:null,fields:[
    {row:[{name:"handle",label:"Handle",type:"text",value:t.handle,required:true},
          {name:"date",label:"Date",type:"date",value:t.date}]},
    {row:[{name:"role",label:"Role tried",type:"select",options:ROLES,value:t.role},
          {name:"tier",label:"Peak tier",type:"select",options:RANK_TIERS,value:t.tier}]},
    {name:"div",label:"Division",type:"select",options:[1,2,3],value:t.div},
    {name:"agents",label:"Agents played",type:"multiselect",options:AGENTS,value:t.agents},
    {row:[{name:"mech",label:"Mechanics /10",type:"number",value:t.scores.mech,min:1,max:10},
          {name:"util",label:"Utility /10",type:"number",value:t.scores.util,min:1,max:10}]},
    {row:[{name:"comms",label:"Comms /10",type:"number",value:t.scores.comms,min:1,max:10},
          {name:"att",label:"Attitude /10",type:"number",value:t.scores.att,min:1,max:10}]},
    {name:"verdict",label:"Verdict",type:"select",options:VERDICTS,value:t.verdict},
    {name:"notes",label:"Commentary",type:"textarea",value:t.notes},
  ]},d=>{
    const rec={handle:d.handle,date:d.date,role:d.role,tier:d.tier,div:+d.div,agents:d.agents,
      scores:{mech:+d.mech,util:+d.util,comms:+d.comms,att:+d.att},verdict:d.verdict,notes:d.notes};
    if(id)Object.assign(t,rec);else team().tryouts.push({id:uid(),...rec});
    save();render();toast(id?"Tryout updated":"Tryout logged");
  });
}

const VIEWS={overview:VIEWS_overview,roster:VIEWS_roster,schedule:VIEWS_schedule,activities:VIEWS_activities,
  ranks:VIEWS_ranks,scrims:VIEWS_scrims,performance:VIEWS_performance,complab:VIEWS_complab,tryouts:VIEWS_tryouts};

/* ============================================================ generic form modal */
function modalShell(title,bodyEl,onSubmit,onDel){
  const root=$("#modal-root");
  root.innerHTML="";
  const wrap=document.createElement("div");wrap.className="scrim";
  const modal=document.createElement("div");modal.className="modal";
  const h=document.createElement("div");h.className="modal-h";
  h.innerHTML=`<h3>${esc(title)}</h3><button class="icar" data-x>✕</button>`;
  const f=document.createElement("div");f.className="modal-f";
  f.innerHTML=`${onDel?'<button class="btn ghost sm" data-del style="margin-right:auto;color:var(--crit);border-color:var(--crit)">Delete</button>':''}
    <button class="btn ghost" data-x>Cancel</button><button class="btn" data-ok>Save</button>`;
  modal.append(h,bodyEl,f);wrap.append(modal);root.append(wrap);
  const close=()=>root.innerHTML="";
  wrap.addEventListener("click",e=>{if(e.target===wrap)close();});
  root.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);
  f.querySelector("[data-ok]").onclick=()=>{onSubmit();close();};
  if(onDel)f.querySelector("[data-del]").onclick=()=>{if(confirm("Delete this?")){onDel();close();}};
  document.addEventListener("keydown",function esc2(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",esc2);}});
}
function openForm({title,fields,del},onSubmit){
  const body=document.createElement("div");body.className="modal-b";
  const refs={};
  const mkField=(fd)=>{
    const wrap=document.createElement("div");wrap.className="fld";
    const id="ff_"+fd.name;
    let inner=`<label for="${id}">${esc(fd.label)}</label>`;
    if(fd.type==="textarea"){inner+=`<textarea id="${id}">${esc(fd.value||"")}</textarea>`;}
    else if(fd.type==="select"){
      const opts=fd.options.map(o=>typeof o==="object"?o:{v:o,t:o});
      inner+=`<select id="${id}">${opts.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(fd.value)?'selected':''}>${esc(o.t)}</option>`).join("")}</select>`;
    }
    else if(fd.type==="multiselect"){
      inner+=`<div class="checks" id="${id}">${fd.options.map(o=>`<label class="${(fd.value||[]).includes(o)?'on':''}"><input type="checkbox" value="${esc(o)}" ${(fd.value||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join("")}</div>`;
    }
    else{inner+=`<input id="${id}" type="${fd.type||'text'}" value="${esc(fd.value??"")}" ${fd.min!=null?`min="${fd.min}"`:''} ${fd.max!=null?`max="${fd.max}"`:''} ${fd.step?`step="${fd.step}"`:''}>`;}
    if(fd.hint)inner+=`<span class="hint">${esc(fd.hint)}</span>`;
    wrap.innerHTML=inner;
    refs[fd.name]=fd;
    return wrap;
  };
  fields.forEach(fd=>{
    if(fd.row){
      const r=document.createElement("div");r.className="fld row2";
      fd.row.forEach(sub=>r.append(mkField(sub)));
      body.append(r);
    }else body.append(mkField(fd));
  });
  body.querySelectorAll(".checks label").forEach(l=>l.onclick=e=>{
    if(e.target.tagName!=="INPUT"){const cb=l.querySelector("input");cb.checked=!cb.checked;}
    setTimeout(()=>l.classList.toggle("on",l.querySelector("input").checked));
  });
  modalShell(title,body,()=>{
    const data={};
    Object.values(refs).forEach(fd=>{
      const el=body.querySelector("#ff_"+fd.name);
      if(fd.type==="multiselect")data[fd.name]=[...el.querySelectorAll("input:checked")].map(i=>i.value);
      else data[fd.name]=el.value;
    });
    onSubmit(data);
  },del);
}

$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b){state.view=b.dataset.v;render();}});
$("#wkPrev").onclick=()=>{state.week=addDays(state.week,-7);render();};
$("#wkNext").onclick=()=>{state.week=addDays(state.week,7);render();};
$("#tourPill").onclick=()=>{
  const k=iso(state.week),tw=team().tournamentWeeks,i=tw.indexOf(k);
  if(i<0)tw.push(k);else tw.splice(i,1);save();render();
  toast(i<0?"Marked tournament week":"Unmarked");
};
$("#teamSelect").onchange=e=>{
  if(e.target.value==="__new"){
    openForm({title:"New team",fields:[
      {name:"name",label:"Team name",type:"text",value:"",required:true},
      {name:"tag",label:"Tag",type:"text",value:""},
    ]},d=>{
      const nt={id:uid(),name:d.name,tag:d.tag||d.name.slice(0,4).toUpperCase(),server:"EU",rankApiKey:"",
        scrimGoal:{base:1,tournament:3},tournamentWeeks:[],roster:[],scrims:[],rankSnapshots:[],tryouts:[],
        schedule:{winStart:"11:00",winEnd:"24:00",includeSubs:false,blocks:[]},activities:{weeks:{},months:{}}};
      DB.teams.push(nt);DB.activeTeamId=nt.id;save();render();toast("Team created");
    });
    e.target.value=DB.activeTeamId;
  }else{DB.activeTeamId=e.target.value;save();render();}
};
$("#btnTheme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?null:"dark";
  if(next)document.documentElement.setAttribute("data-theme",next);else document.documentElement.removeAttribute("data-theme");
  try{localStorage.setItem("sightline.theme",next||"");}catch(e){}
};
$("#btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`sightline-${iso(new Date())}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Exported backup file");
};
$("#btnImport").onclick=()=>$("#fileImport").click();
$("#fileImport").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      if(!j||!Array.isArray(j.teams)||!j.teams.length)throw new Error("no teams");
      if(!confirm("Replace all current data with the imported file?"))return;
      DB=j;if(!DB.activeTeamId)DB.activeTeamId=DB.teams[0].id;
      save();render();toast("Imported "+DB.teams.length+" team(s)");
    }catch(err){toast("Import failed — not a valid Sightline export");}
    e.target.value="";
  };
  rd.readAsText(f);
};
$("#btnReset").onclick=()=>{if(confirm("Reset all teams and data to the sample XPE roster?")){localStorage.removeItem(KEY);DB=load();state.week=mondayOf(new Date("2026-09-03"));render();toast("Reset to sample data");}};

try{const th=localStorage.getItem("sightline.theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
render();
</script>
