<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sightline</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131519" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Roboto+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="gate" hidden></div>

<div class="app" id="app" hidden>

  <header class="masthead">
    <div class="brand"><span class="shard"></span>SIGHTLINE</div>
    <div class="mhctl">
      <button class="ibtn" id="btnTheme" aria-label="Theme"></button>
      <span class="mhdiv"></span>
      <button class="acctbtn" id="btnAccount">
        <span class="avatar" id="acctInit">·</span>
        <span class="acctname" id="acctName"></span>
      </button>
    </div>
  </header>

  <div class="titlebar">
    <div class="tt">
      <div class="ttmeta">
        <div class="teamsel">
          <button class="teambtn" id="teamBtn" aria-haspopup="true" aria-expanded="false">
            <span class="ttag" id="teamTag"></span>
            <span class="tname" id="teamName"></span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="teampop" id="teamPop" hidden></div>
        </div>
        <span class="chip" id="roleBadge" hidden></span>
      </div>
      <h1 id="viewTitle">Overview</h1>
    </div>
    <div class="topctl" id="topctl">
      <button class="tourpill" id="tourPill"><i></i>Tournament week</button>
      <div class="weekpick">
        <button id="wkPrev" aria-label="Previous week">‹</button>
        <span class="lbl" id="wkLabel">—</span>
        <button id="wkNext" aria-label="Next week">›</button>
      </div>
    </div>
  </div>

  <nav class="tabs" id="nav"></nav>
  <main id="main"></main>
</div>

<div id="popScrim" hidden></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/api.js"></script>
<script src="/app.js"></script>
</body>
</html>
