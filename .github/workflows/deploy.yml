name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# don't run two deploys at once; let an in-flight one finish
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # scripts/check.mjs imports only node builtins + the zero-dep
      # agent/sightline-agent.mjs and src/valorant.js. No hono, no wrangler ->
      # no `npm ci` needed. If a future check imports src/index.js (hono) or any
      # dependency, add back an install step here.
      - name: Checks (syntax, view render, parser)
        run: node scripts/check.mjs

  deploy:
    # only on a real push to main — never on pull_request, so forked PRs
    # can run `check` but can never touch the deploy secret
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sightline --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
