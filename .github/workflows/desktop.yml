name: Desktop build

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: deb tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y fakeroot

      - run: npm ci
        working-directory: desktop

      - name: version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#desktop-v}"
        working-directory: desktop

      - run: npm run ${{ matrix.cmd }}
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          make_latest: false
          generate_release_notes: true
          name: Sightline Desktop ${{ github.ref_name }}
          body: |
            Desktop build of Sightline (Windows + Linux). **Unsigned** — see below.

            ### Windows
            - `Sightline-Setup-*.exe` — installer (Start-menu + desktop shortcut).
            - `Sightline-*-x64.zip` — no installer: unzip anywhere, run `Sightline.exe`.

            **Chrome blocks the download?** It flags unsigned installers with no
            reputation. Either:
            - `chrome://downloads` → the blocked item → **Keep dangerous file**, or
            - grab the **`.zip`** instead (rarely blocked), or
            - download in Edge / Firefox, or
            - PowerShell: `irm <asset-url> -OutFile Sightline.exe`

            On first run, **SmartScreen** shows "Windows protected your PC" →
            *More info → Run anyway* (once per version).

            ### Linux
            `Sightline-*.AppImage` (mark executable, double-click) or `Sightline-*.deb`.

            ### Using it
            Sign in as normal. On Windows, **Scrims → Scrim importer** has a
            Start/Stop panel that runs the scrim agent for you.
